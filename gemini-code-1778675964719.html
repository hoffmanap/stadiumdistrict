<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District | Visitation Analytics</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        .sidebar { width: 380px; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; height: 100vh; z-index: 10; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .map-container { flex: 1; position: relative; background: #0f172a; }
        .chart-container { height: 160px; margin-top: 10px; }
        input[type=range] { accent-color: #4f46e5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { DeckGL, HexagonLayer, SelectionLayer } = deck;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, LineChart, Line } = Recharts;

        const INITIAL_VIEW_STATE = {
            longitude: -115.183,
            latitude: 36.091,
            zoom: 13,
            pitch: 40,
            bearing: 0
        };

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [hourRange, setHourRange] = useState([0, 23]);
            const [activeDays, setActiveDays] = useState(['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']);
            const [loading, setLoading] = useState(false);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setLoading(true);
                
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const parsed = results.data
                            .filter(d => d['Lat of Visit'] && d['Lon of Visit'])
                            .map(d => {
                                let hr = 0;
                                const t = d['Time of Day'] || "";
                                const match = t.match(/(\d+):/);
                                if (match) {
                                    hr = parseInt(match[1]);
                                    if (t.includes('PM') && hr !== 12) hr += 12;
                                    if (t.includes('AM') && hr === 12) hr = 0;
                                }
                                return {
                                    lat: d['Lat of Visit'],
                                    lng: d['Lon of Visit'],
                                    hr,
                                    day: d['Day of Week'],
                                    date: d['Date']
                                };
                            });
                        setData(parsed);
                        setLoading(false);
                    }
                });
            };

            const filteredData = useMemo(() => {
                return data.filter(d => 
                    d.hr >= hourRange[0] && 
                    d.hr <= hourRange[1] && 
                    activeDays.includes(d.day)
                );
            }, [data, hourRange, activeDays]);

            const hourStats = useMemo(() => {
                const bins = Array(24).fill(0).map((_, i) => ({ hour: i, count: 0 }));
                filteredData.forEach(d => bins[d.hr].count++);
                return bins;
            }, [filteredData]);

            const dayStats = useMemo(() => {
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const stats = days.map(d => ({ day: d, count: 0 }));
                filteredData.forEach(d => {
                    const idx = days.indexOf(d.day);
                    if (idx !== -1) stats[idx].count++;
                });
                return stats;
            }, [filteredData]);

            const layers = [
                new HexagonLayer({
                    id: 'visitation-hex',
                    data: filteredData,
                    getPosition: d => [d.lng, d.lat],
                    radius: 60,
                    extruded: true,
                    elevationScale: 4,
                    colorRange: [[237,248,251],[178,226,226],[102,194,164],[44,162,95],[0,109,44]],
                    pickable: true
                })
            ];

            return (
                <div className="flex w-full h-full">
                    <aside className="sidebar p-6 flex flex-col gap-6">
                        <header>
                            <h1 className="text-xl font-bold text-slate-900 leading-tight">Stadium District</h1>
                            <p className="text-xs text-slate-500 font-semibold tracking-wide uppercase">Visitation Analytics</p>
                        </header>

                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-2">Data Source</label>
                            <input type="file" accept=".csv" onChange={handleFileUpload} className="text-xs w-full cursor-pointer file:rounded-md file:border-0 file:bg-indigo-600 file:text-white file:px-3 file:py-1 file:mr-2" />
                        </div>

                        {data.length > 0 ? (
                            <div className="flex-1 overflow-y-auto space-y-8 pr-2">
                                <section>
                                    <div className="flex justify-between items-end mb-2">
                                        <h3 className="text-sm font-bold text-slate-700">Time: {hourRange[0]}:00+</h3>
                                        <span className="text-xs text-indigo-600 font-bold">{filteredData.length.toLocaleString()} pts</span>
                                    </div>
                                    <input type="range" min="0" max="23" value={hourRange[0]} onChange={e => setHourRange([parseInt(e.target.value), 23])} className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none" />
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <BarChart data={hourStats}>
                                                <Bar dataKey="count" fill="#6366f1" radius={[2, 2, 0, 0]} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </section>

                                <section>
                                    <h3 className="text-sm font-bold text-slate-700 mb-3">Day of Week Filter</h3>
                                    <div className="flex flex-wrap gap-2 mb-4">
                                        {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                                            <button key={d} onClick={() => setActiveDays(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d])}
                                                className={`px-3 py-1 rounded-md text-xs font-bold transition ${activeDays.includes(d) ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                                {d}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="chart-container">
                                        <ResponsiveContainer>
                                            <BarChart data={dayStats}>
                                                <XAxis dataKey="day" fontSize={10} axisLine={false} tickLine={false} />
                                                <Bar dataKey="count" fill="#818cf8" radius={[2, 2, 0, 0]} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </section>
                            </div>
                        ) : (
                            <div className="flex-1 flex items-center justify-center border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 text-sm italic p-10 text-center">
                                Upload the 2025 dataset to generate the hexbins and charts.
                            </div>
                        )}
                        
                        <footer className="pt-4 border-t border-slate-100 text-[10px] text-slate-400">
                            Hold <strong>CTRL + Drag</strong> to tilt map.
                        </footer>
                    </aside>

                    <main className="map-container">
                        <DeckGL initialViewState={INITIAL_VIEW_STATE} controller={true} layers={layers} getTooltip={({object}) => object && `Total Visits: ${object.points.length}`} />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
