
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District Dashboard</title>
    <!-- Using only the most essential, bulletproof libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        #main { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 340px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; z-index: 1000; overflow-y: auto; color: white; }
        #map { flex-grow: 1; z-index: 1; }
        .hex-bin { transition: all 0.2s; pointer-events: none; }
    </style>
</head>
<body>
    <div id="main">
        <aside id="sidebar">
            <h1 class="text-xl font-black mb-1 italic">STADIUM ANALYTICS</h1>
            <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-6">Internal Hotspot Tool</p>

            <div class="mb-6 p-4 bg-slate-800 rounded-lg border border-slate-700">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Upload September CSV</label>
                <input type="file" id="csv-input" accept=".csv" class="text-xs w-full cursor-pointer file:bg-indigo-600 file:text-white file:border-0 file:px-2 file:py-1 file:rounded" />
            </div>

            <div id="controls-panel" class="space-y-6">
                <div class="bg-indigo-900/40 p-4 rounded-xl border border-indigo-500/30">
                    <div id="vis-count" class="text-3xl font-black">0</div>
                    <div class="text-[10px] font-bold text-indigo-300 uppercase">Filtered Records</div>
                </div>

                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase mb-2">
                            <span>Time: <span id="time-label" class="text-white">0:00 - 23:59</span></span>
                        </div>
                        <input type="range" id="start-h" min="0" max="23" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500 mb-2">
                        <input type="range" id="end-h" min="0" max="23" value="23" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Day Filter</label>
                        <div class="grid grid-cols-4 gap-1" id="day-grid"></div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-700">
                    <div class="h-2 w-full rounded bg-gradient-to-r from-blue-500 via-yellow-400 to-red-600 mb-1"></div>
                    <div class="flex justify-between text-[9px] text-slate-500 font-bold uppercase">
                        <span>Low</span>
                        <span>Hotspot</span>
                    </div>
                </div>
            </div>
        </aside>
        <div id="map"></div>
    </div>

    <script>
        // --- 1. SETUP MAP ---
        const map = L.map('map', { zoomControl: false }).setView([36.091, -115.183], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            attribution: 'CartoDB'
        }).addTo(map);

        // SVG Overlay for Hexagons (Native Leaflet approach, no plugins)
        const svgLayer = L.svg({clickable: false}).addTo(map);
        const g = d3.select(svgLayer.getElement()).append('g');

        let rawData = [];
        let activeDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // --- 2. BUILD UI ---
        const grid = document.getElementById('day-grid');
        activeDays.forEach(day => {
            const b = document.createElement('button');
            b.innerText = day;
            b.id = 'btn-' + day;
            b.className = 'py-1 text-[9px] font-bold rounded bg-indigo-600 text-white transition';
            b.onclick = () => {
                if (activeDays.includes(day)) {
                    activeDays = activeDays.filter(d => d !== day);
                    b.className = 'py-1 text-[9px] font-bold rounded bg-slate-700 text-slate-500';
                } else {
                    activeDays.push(day);
                    b.className = 'py-1 text-[9px] font-bold rounded bg-indigo-600 text-white';
                }
                render();
            };
            grid.appendChild(b);
        });

        // --- 3. CSV LOGIC ---
        document.getElementById('csv-input').onchange = (e) => {
            Papa.parse(e.target.files[0], {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => {
                        const clean = {};
                        Object.keys(r).forEach(k => clean[k.trim()] = r[k]);
                        let hr = 0;
                        const t = clean['Time of Day'] || "";
                        const m = t.match(/(\d+):/);
                        if (m) {
                            hr = parseInt(m[1]);
                            if (t.includes('PM') && hr !== 12) hr += 12;
                            if (t.includes('AM') && hr === 12) hr = 0;
                        }
                        return { lat: clean['Lat of Visit'], lng: clean['Lon of Visit'], hr, day: clean['Day of Week'] };
                    }).filter(r => r.lat && r.lng);
                    render();
                }
            });
        };

        // --- 4. HEXBIN LOGIC (Custom math to avoid plugin failure) ---
        function getHexBin(lng, lat, radius) {
            const x = lng * 1000; // Simplified projection
            const y = lat * 1000;
            const q = Math.round(x / radius);
            const r = Math.round(y / radius);
            return `${q},${r}`;
        }

        function render() {
            const start = parseInt(document.getElementById('start-h').value);
            const end = parseInt(document.getElementById('end-h').value);
            const minH = Math.min(start, end);
            const maxH = Math.max(start, end);

            const filtered = rawData.filter(d => 
                d.hr >= minH && d.hr <= maxH && activeDays.includes(d.day)
            );

            // Update Labels
            document.getElementById('vis-count').innerText = filtered.length.toLocaleString();
            document.getElementById('time-label').innerText = `${minH}:00 - ${maxH}:59`;

            // Clear previous bins
            g.selectAll('*').remove();

            if (filtered.length === 0) return;

            // Aggregation
            const bins = {};
            filtered.forEach(p => {
                const key = getHexBin(p.lng, p.lat, 0.4); // Adjust resolution here
                if (!bins[key]) bins[key] = { count: 0, lat: p.lat, lng: p.lng };
                bins[key].count++;
            });

            const counts = Object.values(bins).map(b => b.count);
            const maxCount = Math.max(...counts);

            const colorScale = (val) => {
                const ratio = val / maxCount;
                if (ratio < 0.3) return '#3b82f6'; // Blue
                if (ratio < 0.7) return '#facc15'; // Yellow
                return '#ef4444'; // Red
            };

            Object.values(bins).forEach(bin => {
                const point = map.latLngToLayerPoint([bin.lat, bin.lng]);
                g.append('circle')
                    .attr('cx', point.x)
                    .attr('cy', point.y)
                    .attr('r', 8) // Visual bin size
                    .attr('fill', colorScale(bin.count))
                    .attr('fill-opacity', 0.6)
                    .attr('class', 'hex-bin');
            });
        }

        map.on('moveend', render);
        document.getElementById('start-h').oninput = render;
        document.getElementById('end-h').oninput = render;
    </script>
</body>
</html>
