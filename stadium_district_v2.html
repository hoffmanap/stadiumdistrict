
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium District Dashboard</title>
    <!-- Use reliable CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
        .sidebar { width: 350px; flex-shrink: 0; background: white; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; z-index: 10; }
        .map-container { flex-grow: 1; position: relative; background: #111; }
        input[type="range"] { width: 100%; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { DeckGL, HexagonLayer } = deck;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = Recharts;

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [viewState, setViewState] = useState({
                longitude: -115.183,
                latitude: 36.091,
                zoom: 13,
                pitch: 45,
                bearing: 0
            });
            const [hourFilter, setHourFilter] = useState([0, 23]);
            const [selectedDays, setSelectedDays] = useState(['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']);

            const onFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const parsed = results.data
                            .filter(d => d['Lat of Visit'] && d['Lon of Visit'])
                            .map(d => {
                                let hour = 0;
                                const timeStr = d['Time of Day'] || "";
                                const match = timeStr.match(/(\d+):/);
                                if (match) {
                                    hour = parseInt(match[1]);
                                    if (timeStr.includes('PM') && hour !== 12) hour += 12;
                                    if (timeStr.includes('AM') && hour === 12) hour = 0;
                                }
                                return {
                                    lat: d['Lat of Visit'],
                                    lng: d['Lon of Visit'],
                                    hour: hour,
                                    day: d['Day of Week']
                                };
                            });
                        setData(parsed);
                    }
                });
            };

            const filteredData = useMemo(() => {
                return data.filter(d => 
                    d.hour >= hourFilter[0] && 
                    d.hour <= hourFilter[1] && 
                    selectedDays.includes(d.day)
                );
            }, [data, hourFilter, selectedDays]);

            const hourStats = useMemo(() => {
                const bins = Array(24).fill(0).map((_, i) => ({ hour: i, count: 0 }));
                filteredData.forEach(d => bins[d.hour].count++);
                return bins;
            }, [filteredData]);

            const layers = [
                new HexagonLayer({
                    id: 'hex',
                    data: filteredData,
                    getPosition: d => [d.lng, d.lat],
                    radius: 50,
                    extruded: true,
                    elevationScale: 4,
                    colorRange: [[239,243,255],[189,215,231],[107,174,214],[49,130,189],[8,81,156]]
                })
            ];

            return (
                <div className="flex h-full w-full">
                    <div className="sidebar flex flex-col gap-6 shadow-xl">
                        <div>
                            <h1 className="text-xl font-bold text-slate-800">Stadium District</h1>
                            <p className="text-xs text-slate-500 mb-4">2025 Visitation Explorer</p>
                            <input 
                                type="file" 
                                accept=".csv" 
                                onChange={onFileUpload}
                                className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                            />
                        </div>

                        {data.length > 0 && (
                            <>
                                <div className="p-4 bg-blue-50 rounded-lg">
                                    <div className="text-2xl font-bold text-blue-900">{filteredData.length.toLocaleString()}</div>
                                    <div className="text-xs font-semibold text-blue-600 uppercase">Filtered Visits</div>
                                </div>

                                <div>
                                    <h3 className="text-sm font-bold mb-2">Hour of Day ({hourFilter[0]}:00+)</h3>
                                    <input 
                                        type="range" min="0" max="23" value={hourFilter[0]} 
                                        onChange={e => setHourFilter([parseInt(e.target.value), 23])}
                                    />
                                    <div className="h-32 mt-2">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={hourStats}>
                                                <Bar dataKey="count" fill="#3b82f6" />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-sm font-bold mb-2">Day of Week</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                                            <button 
                                                key={day}
                                                onClick={() => {
                                                    setSelectedDays(prev => prev.includes(day) ? prev.filter(d => d !== day) : [...prev, day]);
                                                }}
                                                className={`px-2 py-1 text-xs rounded font-medium ${selectedDays.includes(day) ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                            >
                                                {day}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </>
                        )}
                        
                        {data.length === 0 && (
                            <div className="mt-10 text-center text-slate-400 italic">
                                Please upload the CSV to begin.
                            </div>
                        )}
                    </div>

                    <div className="map-container">
                        <DeckGL
                            initialViewState={viewState}
                            controller={true}
                            onViewStateChange={({viewState}) => setViewState(viewState)}
                            layers={layers}
                            getTooltip={({object}) => object && `Visits: ${object.points.length}`}
                        />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
