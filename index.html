<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
        .sidebar { width: 360px; background: white; height: 100vh; z-index: 10; padding: 24px; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; }
        .map-container { flex-grow: 1; position: relative; }
    </style>
</head>
<body>
    <div id="root">
        <div style="color: white; padding: 50px; text-align: center; font-family: sans-serif;">
            <h2>Loading Dashboard Engine...</h2>
            <p>If this page stays blank for more than 5 seconds, check your internet connection or console for script errors.</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { DeckGL, HexagonLayer } = deck;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [hour, setHour] = useState(0);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    complete: (res) => {
                        const parsed = res.data
                            .filter(d => d['Lat of Visit'] && d['Lon of Visit'])
                            .map(d => ({
                                lat: d['Lat of Visit'],
                                lng: d['Lon of Visit'],
                                hr: parseInt((d['Time of Day'] || "").split(':')[0]) || 0,
                                day: d['Day of Week']
                            }));
                        setData(parsed);
                    }
                });
            };

            const filtered = useMemo(() => data.filter(d => d.hr >= hour), [data, hour]);

            const layers = [
                new HexagonLayer({
                    id: 'hex',
                    data: filtered,
                    getPosition: d => [d.lng, d.lat],
                    radius: 50,
                    extruded: true,
                    elevationScale: 5,
                    colorRange: [[237,248,251],[178,226,226],[102,194,164],[44,162,95],[0,109,44]]
                })
            ];

            return (
                <div className="flex h-full">
                    <div className="sidebar shadow-2xl">
                        <h1 className="text-xl font-bold text-slate-800">Stadium District</h1>
                        <p className="text-xs text-slate-500 mb-6">September 2025 Visitation</p>
                        
                        <input type="file" accept=".csv" onChange={handleFile} className="mb-6 text-sm file:bg-indigo-600 file:text-white file:border-none file:px-3 file:py-2 file:rounded" />
                        
                        {data.length > 0 && (
                            <div className="space-y-6">
                                <div className="bg-indigo-50 p-4 rounded-lg">
                                    <div className="text-2xl font-black text-indigo-700">{filtered.length.toLocaleString()}</div>
                                    <div className="text-[10px] uppercase font-bold text-indigo-400">Total Filtered Records</div>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold text-slate-400 uppercase">Start Hour: {hour}:00</label>
                                    <input type="range" min="0" max="23" value={hour} onChange={e => setHour(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-200 rounded-lg appearance-none mt-2" />
                                </div>
                            </div>
                        )}
                    </div>
                    <div className="map-container">
                        <DeckGL
                            initialViewState={{longitude: -115.183, latitude: 36.091, zoom: 12, pitch: 45}}
                            controller={true}
                            layers={layers}
                        />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
