<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium District Visitation Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 400px; background: #f8fafc; border-right: 1px solid #e2e8f0; padding: 20px; overflow-y: auto; z-index: 10; }
        #map-container { flex-grow: 1; position: relative; background: #0f172a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { DeckGL, HexagonLayer, SelectionLayer } = deck;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, LineChart, Line } = Recharts;

        // Configuration for Clark County Stadium District
        const INITIAL_VIEW_STATE = {
            longitude: -115.1833,
            latitude: 36.0909,
            zoom: 14,
            pitch: 45,
            bearing: 0
        };

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [hourRange, setHourRange] = useState([0, 23]);
            const [selectedPolygon, setSelectedPolygon] = useState(null);

            // Fetch or load data (Placeholder for your CSV/JSON)
            useEffect(() => {
                // In a production scenario, you would parse your OneDrive CSV here
                // mockData generation for demonstration:
                const mockData = Array.from({ length: 2000 }, () => ({
                    lat: 36.0909 + (Math.random() - 0.5) * 0.02,
                    lng: -115.1833 + (Math.random() - 0.5) * 0.02,
                    hour: Math.floor(Math.random() * 24),
                    day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][Math.floor(Math.random() * 7)],
                    timestamp: new Date(2025, 0, Math.random() * 365).getTime()
                }));
                setData(mockData);
                setFilteredData(mockData);
            }, []);

            // Handle Filtering Logic
            useEffect(() => {
                let filtered = data.filter(d => d.hour >= hourRange[0] && d.hour <= hourRange[1]);
                
                if (selectedPolygon) {
                    // Logic for point-in-polygon filtering would go here
                }
                
                setFilteredData(filtered);
            }, [hourRange, selectedPolygon, data]);

            const layers = [
                new HexagonLayer({
                    id: 'visitation-hex',
                    data: filteredData,
                    getPosition: d => [d.lng, d.lat],
                    radius: 50,
                    elevationScale: 4,
                    extruded: true,
                    pickable: true,
                    colorRange: [
                        [255, 255, 178], [254, 217, 118], [254, 178, 76],
                        [253, 141, 60], [240, 59, 32], [189, 0, 38]
                    ]
                })
            ];

            // Aggregate data for charts
            const timeOfDayData = useMemo(() => {
                const bins = Array(24).fill(0).map((_, i) => ({ name: `${i}:00`, value: 0 }));
                filteredData.forEach(d => bins[d.hour].value++);
                return bins;
            }, [filteredData]);

            return (
                <div id="container">
                    <div id="sidebar">
                        <h1 className="text-xl font-bold mb-4">Stadium District Analytics</h1>
                        
                        <div className="mb-8">
                            <label className="block text-sm font-medium mb-2">Time of Day Filter (00:00 - 23:00)</label>
                            <input 
                                type="range" min="0" max="23" 
                                className="w-full"
                                onChange={(e) => setHourRange([parseInt(e.target.value), 23])}
                            />
                        </div>

                        <div className="h-64 mb-8">
                            <h3 className="text-sm font-semibold mb-2">Visitation by Hour</h3>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={timeOfDayData}>
                                    <CartesianGrid strokeDasharray="3 3" />
                                    <XAxis dataKey="name" fontSize={10} />
                                    <YAxis fontSize={10} />
                                    <Tooltip />
                                    <Bar dataKey="value" fill="#4f46e5" />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>

                        <div className="text-xs text-gray-500 mt-4">
                            Use the Lasso tool (Ctrl + Drag) to filter by custom area.
                        </div>
                    </div>

                    <div id="map-container">
                        <DeckGL
                            initialViewState={INITIAL_VIEW_STATE}
                            controller={true}
                            layers={layers}
                        />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
