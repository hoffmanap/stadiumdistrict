<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html, #root { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #f8fafc; }
        .sidebar { width: 350px; background: white; border-right: 1px solid #e2e8f0; padding: 20px; z-index: 10; display: flex; flex-direction: column; height: 100vh; }
        .map-container { flex-grow: 1; position: relative; background: #0f172a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Use standard JavaScript (No Babel needed)
        const e = React.createElement;
        const { useState, useMemo } = React;

        const App = () => {
            const [data, setData] = useState([]);
            const [hour, setHour] = useState(0);

            const onFile = (evt) => {
                const file = evt.target.files[0];
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    complete: (res) => {
                        console.log("Parsed rows:", res.data.length);
                        const clean = res.data
                            .filter(d => d['Lat of Visit'] && d['Lon of Visit'])
                            .map(d => ({
                                position: [d['Lon of Visit'], d['Lat of Visit']],
                                hr: parseInt((d['Time of Day'] || "0").split(':')[0]) || 0
                            }));
                        setData(clean);
                    }
                });
            };

            const filtered = useMemo(() => data.filter(d => d.hr >= hour), [data, hour]);

            const layers = [
                new deck.HexagonLayer({
                    id: 'hex',
                    data: filtered,
                    getPosition: d => d.position,
                    radius: 50,
                    extruded: true,
                    elevationScale: 10,
                    colorRange: [[237,248,251],[178,226,226],[102,194,164],[44,162,95],[0,109,44]]
                })
            ];

            return e('div', { className: 'flex h-full' },
                e('div', { className: 'sidebar shadow-xl' },
                    e('h1', { className: 'text-xl font-bold mb-1' }, 'Stadium District'),
                    e('p', { className: 'text-xs text-gray-500 mb-6 font-mono' }, 'Clark County, NV'),
                    
                    e('input', { 
                        type: 'file', 
                        accept: '.csv', 
                        onChange: onFile,
                        className: 'text-xs mb-8 block w-full file:bg-blue-600 file:text-white file:border-none file:px-3 file:py-2 file:rounded'
                    }),

                    data.length > 0 && e('div', { className: 'space-y-6' },
                        e('div', { className: 'bg-blue-50 p-4 rounded-lg' },
                            e('div', { className: 'text-2xl font-black text-blue-700' }, filtered.length.toLocaleString()),
                            e('div', { className: 'text-[10px] uppercase font-bold text-blue-400' }, 'Filtered Visits')
                        ),
                        e('div', null,
                            e('label', { className: 'text-xs font-bold text-gray-400 uppercase' }, `Start Hour: ${hour}:00`),
                            e('input', {
                                type: 'range', min: 0, max: 23, value: hour,
                                onChange: (v) => setHour(parseInt(v.target.value)),
                                className: 'w-full h-1.5 mt-2 bg-gray-200 rounded-lg appearance-none cursor-pointer'
                            })
                        )
                    ),
                    data.length === 0 && e('p', { className: 'text-sm text-gray-400 italic mt-10 text-center' }, 'Upload September 2025 Example.csv to start.')
                ),
                e('div', { className: 'map-container' },
                    e(deck.DeckGL, {
                        initialViewState: { longitude: -115.183, latitude: 36.091, zoom: 12, pitch: 45 },
                        controller: true,
                        layers: layers
                    })
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
