
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stadium District Visitation Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; background: #0f172a; }
        #root { height: 100%; display: flex; flex-direction: column; }
        .sidebar { width: 380px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; z-index: 20; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .map-container { flex: 1; position: relative; }
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        input[type=range] { accent-color: #6366f1; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { DeckGL, HexagonLayer, SelectionLayer } = deck;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, Cell, CartesianGrid } = Recharts;

        const INITIAL_VIEW_STATE = {
            longitude: -115.183,
            latitude: 36.091,
            zoom: 13,
            pitch: 30,
            bearing: 0
        };

        const Dashboard = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [range, setRange] = useState([0, 23]);
            const [activeDays, setActiveDays] = useState(['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']);
            const [selectionPolygon, setSelectionPolygon] = useState(null);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setLoading(true);
                Papa.parse(file, {
                    header: true,
                    dynamicTyping: true,
                    complete: (results) => {
                        const cleanData = results.data
                            .filter(d => d['Lat of Visit'] && d['Lon of Visit'])
                            .map(d => {
                                let hr = 0;
                                const t = d['Time of Day'];
                                if (t) {
                                    const m = t.match(/(\d+):/);
                                    hr = parseInt(m ? m[1] : 0);
                                    if (t.includes('PM') && hr !== 12) hr += 12;
                                    if (t.includes('AM') && hr === 12) hr = 0;
                                }
                                return {
                                    lat: d['Lat of Visit'],
                                    lng: d['Lon of Visit'],
                                    hr,
                                    day: d['Day of Week'],
                                    date: d['Date']
                                };
                            });
                        setData(cleanData);
                        setLoading(false);
                    }
                });
            };

            const filteredData = useMemo(() => {
                return data.filter(d => 
                    d.hr >= range[0] && d.hr <= range[1] && activeDays.includes(d.day)
                );
            }, [data, range, activeDays]);

            const hourData = useMemo(() => {
                const res = Array(24).fill(0).map((_, i) => ({ hr: i, count: 0 }));
                filteredData.forEach(d => res[d.hr].count++);
                return res;
            }, [filteredData]);

            const dayData = useMemo(() => {
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const res = days.map(day => ({ day, count: 0 }));
                filteredData.forEach(d => {
                    const idx = days.indexOf(d.day);
                    if (idx !== -1) res[idx].count++;
                });
                return res;
            }, [filteredData]);

            const dateData = useMemo(() => {
                const map = {};
                filteredData.forEach(d => map[d.date] = (map[d.date] || 0) + 1);
                return Object.entries(map).map(([date, count]) => ({ date, count }))
                    .sort((a,b) => new Date(a.date) - new Date(b.date));
            }, [filteredData]);

            const layers = [
                new HexagonLayer({
                    id: 'hex-layer',
                    data: filteredData,
                    getPosition: d => [d.lng, d.lat],
                    radius: 50,
                    extruded: true,
                    elevationScale: 5,
                    pickable: true,
                    colorRange: [[237,248,251],[178,226,226],[102,194,164],[44,162,95],[0,109,44]]
                })
            ];

            return (
                <div className="flex flex-col h-full bg-slate-50">
                    <header className="h-14 bg-indigo-700 text-white flex items-center justify-between px-6 shadow-md z-10">
                        <div className="flex items-center gap-3">
                            <span className="text-xl font-black tracking-tighter italic">STADIUM DISTRICT AI</span>
                            <div className="h-4 w-[1px] bg-indigo-400 mx-2"></div>
                            <span className="text-sm font-medium opacity-90">2025 Visitation Dashboard</span>
                        </div>
                        <div className="flex items-center gap-4">
                            {loading && <div className="loader"></div>}
                            <input type="file" onChange={handleFile} className="text-xs file:bg-indigo-500 file:text-white file:border-none file:px-3 file:py-1 file:rounded cursor-pointer" />
                        </div>
                    </header>

                    <div className="main-content">
                        <aside className="sidebar">
                            <div className="mb-4">
                                <h2 className="text-2xl font-bold text-slate-800">{filteredData.length.toLocaleString()}</h2>
                                <p className="text-xs text-slate-500 font-bold uppercase tracking-wider">Total Filtered Visits</p>
                            </div>

                            <div className="card">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-sm font-bold text-slate-700">Time Filter</h3>
                                    <span className="text-xs font-mono bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">{range[0]}:00 - {range[1]}:00</span>
                                </div>
                                <input 
                                    type="range" min="0" max="23" value={range[0]} 
                                    onChange={e => setRange([parseInt(e.target.value), 23])} 
                                    className="w-full mb-4 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                                />
                                <div className="h-32">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={hourData}>
                                            <XAxis dataKey="hr" hide />
                                            <Tooltip />
                                            <Bar dataKey="count" fill="#818cf8" radius={[2, 2, 0, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="card">
                                <h3 className="text-sm font-bold text-slate-700 mb-4">Day of Week Filter</h3>
                                <div className="h-32">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={dayData}>
                                            <XAxis dataKey="day" fontSize={10} axisLine={false} tickLine={false} />
                                            <Bar dataKey="count" fill="#c084fc" radius={[2, 2, 0, 0]}>
                                                {dayData.map((entry, index) => (
                                                    <Cell 
                                                        key={index} 
                                                        fill={activeDays.includes(entry.day) ? '#8b5cf6' : '#f1f5f9'}
                                                        className="cursor-pointer"
                                                        onClick={() => {
                                                            const next = activeDays.includes(entry.day)
                                                                ? activeDays.filter(x => x !== entry.day)
                                                                : [...activeDays, entry.day];
                                                            setActiveDays(next);
                                                        }}
                                                    />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="card">
                                <h3 className="text-sm font-bold text-slate-700 mb-4">Daily Trend</h3>
                                <div className="h-32">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={dateData}>
                                            <XAxis dataKey="date" hide />
                                            <Tooltip />
                                            <Line type="monotone" dataKey="count" stroke="#f472b6" strokeWidth={2} dot={false} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </aside>

                        <main className="map-container">
                            <DeckGL
                                initialViewState={INITIAL_VIEW_STATE}
                                controller={true}
                                layers={layers}
                                getTooltip={({object}) => object && `Visits: ${object.points.length}`}
                            />
                            <div className="absolute top-4 left-4 bg-white/90 p-3 rounded shadow-sm text-[10px] uppercase font-bold text-slate-500 flex flex-col gap-1">
                                <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#edf8fb]"></span> Sparse</div>
                                <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#006d2c]"></span> Dense</div>
                            </div>
                            <div className="absolute bottom-4 right-4 bg-black/50 text-white text-[10px] p-2 rounded backdrop-blur-sm">
                                Hold CTRL + Drag to Pan | Scroll to Zoom
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
