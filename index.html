<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District Hotspot Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        #main { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 340px; background: #1e293b; border-right: 1px solid #334155; padding: 20px; z-index: 1000; overflow-y: auto; color: white; }
        #map { flex-grow: 1; z-index: 1; }
        input[type=range] { width: 100%; height: 6px; background: #334155; border-radius: 5px; appearance: none; outline: none; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
    </style>
</head>
<body>
    <div id="main">
        <aside id="sidebar">
            <h1 class="text-xl font-black mb-1 italic">STADIUM ANALYTICS</h1>
            <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-6">Internal Hotspot Tool</p>

            <div class="mb-6 p-4 bg-slate-800 rounded-lg border border-slate-700">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Upload Data</label>
                <input type="file" id="csv-input" accept=".csv" class="text-xs w-full cursor-pointer file:bg-indigo-600 file:text-white file:border-0 file:px-2 file:py-1 file:rounded" />
            </div>

            <div id="controls-panel" class="space-y-6">
                <div class="bg-indigo-900/40 p-4 rounded-xl border border-indigo-500/30">
                    <div id="vis-count" class="text-3xl font-black">0</div>
                    <div class="text-[10px] font-bold text-indigo-300 uppercase">Filtered Records</div>
                </div>

                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-400 uppercase mb-2">
                            <span>Time: <span id="time-label" class="text-white">0:00 - 23:59</span></span>
                        </div>
                        <input type="range" id="start-h" min="0" max="23" value="0" class="mb-2">
                        <input type="range" id="end-h" min="0" max="23" value="23">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Day Filter</label>
                        <div class="grid grid-cols-4 gap-1" id="day-grid"></div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-700">
                    <div class="h-2 w-full rounded bg-gradient-to-r from-blue-500 via-yellow-400 to-red-600 mb-1"></div>
                    <div class="flex justify-between text-[9px] text-slate-500 font-bold uppercase">
                        <span>Low</span>
                        <span>Hotspot</span>
                    </div>
                </div>
            </div>
        </aside>
        <div id="map"></div>
    </div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([36.091, -115.183], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            attribution: 'CartoDB'
        }).addTo(map);

        let rawData = [];
        let activeDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        let overlayLayer = L.layerGroup().addTo(map);

        // Build Day Buttons
        const grid = document.getElementById('day-grid');
        activeDays.forEach(day => {
            const b = document.createElement('button');
            b.innerText = day;
            b.id = 'btn-' + day;
            b.className = 'py-1 text-[9px] font-bold rounded bg-indigo-600 text-white transition';
            b.onclick = () => {
                if (activeDays.includes(day)) {
                    activeDays = activeDays.filter(d => d !== day);
                    b.className = 'py-1 text-[9px] font-bold rounded bg-slate-700 text-slate-500';
                } else {
                    activeDays.push(day);
                    b.className = 'py-1 text-[9px] font-bold rounded bg-indigo-600 text-white';
                }
                render();
            };
            grid.appendChild(b);
        });

        document.getElementById('csv-input').onchange = (e) => {
            Papa.parse(e.target.files[0], {
                header: true,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: (res) => {
                    rawData = res.data.map(r => {
                        // FIX: Aggressive Header Cleaning
                        const clean = {};
                        Object.keys(r).forEach(k => {
                            const cleanKey = k.trim().replace(/[^\x20-\x7E]/g, ''); 
                            clean[cleanKey] = r[k];
                        });

                        // Extract Hour (handling AM/PM)
                        let hr = 0;
                        const tStr = String(clean['Time of Day'] || "");
                        const match = tStr.match(/(\d+):/);
                        if (match) {
                            hr = parseInt(match[1]);
                            if (tStr.toUpperCase().includes('PM') && hr !== 12) hr += 12;
                            if (tStr.toUpperCase().includes('AM') && hr === 12) hr = 0;
                        }
                        
                        return { 
                            lat: clean['Lat of Visit'], 
                            lng: clean['Lon of Visit'], 
                            hr: hr, 
                            day: String(clean['Day of Week']).trim() 
                        };
                    }).filter(r => r.lat && r.lng);
                    render();
                }
            });
        };

        function render() {
            overlayLayer.clearLayers();
            const start = parseInt(document.getElementById('start-h').value);
            const end = parseInt(document.getElementById('end-h').value);
            const minH = Math.min(start, end);
            const maxH = Math.max(start, end);

            const filtered = rawData.filter(d => 
                d.hr >= minH && d.hr <= maxH && activeDays.includes(d.day)
            );

            document.getElementById('vis-count').innerText = filtered.length.toLocaleString();
            document.getElementById('time-label').innerText = `${minH}:00 - ${maxH}:59`;

            if (filtered.length === 0) return;

            // Manual Hex-like Grid Aggregation
            const bins = {};
            const res = 0.001; // Grid resolution (approx 100m)
            
            filtered.forEach(p => {
                const qx = Math.round(p.lng / res) * res;
                const qy = Math.round(p.lat / res) * res;
                const key = `${qx},${qy}`;
                if (!bins[key]) bins[key] = { count: 0, lat: qy, lng: qx };
                bins[key].count++;
            });

            const maxC = Math.max(...Object.values(bins).map(b => b.count));

            Object.values(bins).forEach(b => {
                const ratio = b.count / maxC;
                const color = ratio < 0.3 ? '#3b82f6' : (ratio < 0.7 ? '#facc15' : '#ef4444');
                
                L.circleMarker([b.lat, b.lng], {
                    radius: 7,
                    fillColor: color,
                    color: '#fff',
                    weight: 0.5,
                    fillOpacity: 0.6
                }).addTo(overlayLayer);
            });
        }

        document.getElementById('start-h').oninput = render;
        document.getElementById('end-h').oninput = render;
    </script>
</body>
</html>
