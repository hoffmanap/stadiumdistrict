<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white overflow-hidden">

    <div id="error-log" class="fixed top-0 left-0 w-full bg-red-600 text-white text-xs p-1 z-[9999] hidden"></div>

    <div class="flex h-screen w-screen">
        <aside class="w-80 bg-white text-slate-800 p-6 shadow-2xl z-10 flex flex-col">
            <h1 class="text-xl font-black italic tracking-tighter text-indigo-700">STADIUM ANALYTICS</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-6">Internal Tracking Tool</p>

            <div class="space-y-4">
                <div class="p-4 bg-slate-100 rounded-lg border border-slate-200">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">1. Load Local Data</label>
                    <input type="file" id="csv-input" accept=".csv" class="text-xs w-full cursor-pointer file:bg-indigo-600 file:text-white file:border-0 file:px-2 file:py-1 file:rounded" />
                </div>

                <div id="ui-controls" class="hidden space-y-4">
                    <div class="bg-indigo-700 p-4 rounded-xl text-white">
                        <div id="vis-count" class="text-3xl font-black">0</div>
                        <div class="text-[10px] uppercase opacity-60">Visits Displayed</div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase">Filter: Hour of Day</label>
                        <input type="range" id="hour-filter" min="0" max="23" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer mt-2" />
                        <div id="hour-display" class="text-right text-xs font-mono mt-1 text-slate-500">0:00+</div>
                    </div>
                </div>
            </div>
            
            <div class="mt-auto pt-4 border-t border-slate-100">
                <p class="text-[9px] text-slate-400 leading-tight">
                    If map is blank, ensure your network allows <strong>openstreetmap.org</strong> and <strong>cdnjs.cloudflare.com</strong>.
                </p>
            </div>
        </aside>

        <div id="map" class="flex-1 bg-slate-800"></div>
    </div>

    <script>
        // Diagnostic Logger
        window.onerror = function(msg) {
            const log = document.getElementById('error-log');
            log.innerText = "Script Error: " + msg;
            log.classList.remove('hidden');
        };

        // Initialize Map with fallback coordinates
        const map = L.map('map', { zoomControl: false }).setView([36.091, -115.183], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standard OpenStreetMap tiles (most likely to be allowed by security filters)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);

        let points = [];
        let mapLayer = L.layerGroup().addTo(map);

        const input = document.getElementById('csv-input');
        const controls = document.getElementById('ui-controls');
        const countLabel = document.getElementById('vis-count');
        const slider = document.getElementById('hour-filter');

        input.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    points = results.data
                        .filter(r => r['Lat of Visit'] && r['Lon of Visit'])
                        .map(r => {
                            let h = 0;
                            const time = r['Time of Day'] || "";
                            const m = time.match(/(\d+):/);
                            if (m) {
                                h = parseInt(m[1]);
                                if (time.includes('PM') && h !== 12) h += 12;
                                if (time.includes('AM') && h === 12) h = 0;
                            }
                            return { lat: r['Lat of Visit'], lng: r['Lon of Visit'], hr: h };
                        });
                    
                    controls.classList.remove('hidden');
                    refresh(0);
                }
            });
        });

        function refresh(h) {
            mapLayer.clearLayers();
            let c = 0;
            points.forEach(p => {
                if (p.hr >= h) {
                    c++;
                    // Render 10% of points for high performance
                    if (c % 10 === 0) {
                        L.circleMarker([p.lat, p.lng], {
                            radius: 2,
                            fillColor: '#4f46e5',
                            color: '#fff',
                            weight: 0.5,
                            fillOpacity: 0.5
                        }).addTo(mapLayer);
                    }
                }
            });
            countLabel.innerText = (c).toLocaleString();
            document.getElementById('hour-display').innerText = h + ":00+";
        }

        slider.addEventListener('input', e => refresh(parseInt(e.target.value)));
    </script>
</body>
</html>
