<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stadium District | Advanced Analytics</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://unpkg.com/@asymmetrik/leaflet-d3@6.0.0/dist/leaflet-d3.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0f172a; color: white; }
        #main { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 380px; background: #1e293b; border-right: 1px solid #334155; padding: 24px; z-index: 1000; overflow-y: auto; box-shadow: 10px 0 15px rgba(0,0,0,0.3); }
        #map { flex-grow: 1; z-index: 1; }
        
        /* Custom range slider styling */
        input[type=range] { height: 6px; -webkit-appearance: none; background: #334155; border-radius: 5px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="main">
        <aside id="sidebar">
            <h1 class="text-2xl font-black tracking-tight text-white mb-1">STADIUM DISTRICT</h1>
            <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-8">Spatial Heatmap Analytics</p>

            <div class="mb-8 p-4 bg-slate-800 rounded-xl border border-slate-700">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Dataset Upload</label>
                <input type="file" id="csv-input" accept=".csv" class="text-xs w-full cursor-pointer file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500" />
            </div>

            <div id="controls" class="hidden space-y-8">
                <div class="bg-gradient-to-br from-indigo-600 to-violet-700 p-5 rounded-2xl shadow-lg">
                    <div id="vis-count" class="text-4xl font-black">0</div>
                    <div class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Aggregate Records</div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Time Range</label>
                        <span id="time-label" class="text-xs font-mono bg-slate-700 px-2 py-1 rounded text-indigo-300">00:00 - 23:59</span>
                    </div>
                    <div class="space-y-4">
                        <input type="range" id="start-hour" min="0" max="23" value="0" class="w-full">
                        <input type="range" id="end-hour" min="0" max="23" value="23" class="w-full">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 block">Days of Week</label>
                    <div class="grid grid-cols-4 gap-2" id="day-filters">
                        </div>
                </div>

                <div class="pt-6 border-t border-slate-700">
                    <div class="flex items-center gap-2 mb-4 text-[10px] font-bold text-slate-500 uppercase">
                        <span>Intensity Scale</span>
                    </div>
                    <div class="h-3 w-full rounded-full bg-gradient-to-r from-blue-500 via-yellow-400 to-red-600"></div>
                    <div class="flex justify-between text-[10px] mt-1 text-slate-500 font-mono">
                        <span>LOW</span>
                        <span>HIGH</span>
                    </div>
                </div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <script>
        // 1. UPDATED BASEMAP: Using CartoDB Voyager (Dark with labels and clean colors)
        const map = L.map('map', { zoomControl: false }).setView([36.091, -115.183], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CartoDB'
        }).addTo(map);

        // 2. HEXBIN CONFIGURATION
        const hexLayer = L.hexbinLayer({
            radius: 12, // Small hex size for detailed hotspots
            opacity: 0.7,
            duration: 200
        });

        // Blue to Red Color Scale
        hexLayer.colorScale().range(['#3b82f6', '#facc15', '#ef4444']); 
        hexLayer.addTo(map);

        let masterData = [];
        let activeDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // UI Element Selectors
        const input = document.getElementById('csv-input');
        const countLabel = document.getElementById('vis-count');
        const timeLabel = document.getElementById('time-label');
        const startSlider = document.getElementById('start-hour');
        const endSlider = document.getElementById('end-hour');

        // Generate Day Buttons
        const dayContainer = document.getElementById('day-filters');
        activeDays.forEach(day => {
            const btn = document.createElement('button');
            btn.innerText = day;
            btn.id = `btn-${day}`;
            btn.className = 'px-2 py-2 text-[10px] font-bold rounded-lg transition-all bg-indigo-600 text-white shadow-md';
            btn.onclick = () => toggleDay(day);
            dayContainer.appendChild(btn);
        });

        function toggleDay(day) {
            const idx = activeDays.indexOf(day);
            const btn = document.getElementById(`btn-${day}`);
            if (idx > -1) {
                activeDays.splice(idx, 1);
                btn.className = 'px-2 py-2 text-[10px] font-bold rounded-lg bg-slate-700 text-slate-400';
            } else {
                activeDays.push(day);
                btn.className = 'px-2 py-2 text-[10px] font-bold rounded-lg bg-indigo-600 text-white shadow-md';
            }
            applyFilters();
        }

        input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            Papa.parse(file, {
                header: true,
                dynamicTyping: true,
                complete: (results) => {
                    masterData = results.data
                        .filter(r => r['Lat of Visit'] && r['Lon of Visit'])
                        .map(r => {
                            let h = 0;
                            const t = r['Time of Day'] || "";
                            const m = t.match(/(\d+):/);
                            if (m) {
                                h = parseInt(m[1]);
                                if (t.includes('PM') && h !== 12) h += 12;
                                if (t.includes('AM') && h === 12) h = 0;
                            }
                            return [r['Lon of Visit'], r['Lat of Visit'], h, r['Day of Week']];
                        });
                    document.getElementById('controls').classList.remove('hidden');
                    applyFilters();
                }
            });
        });

        function applyFilters() {
            const start = parseInt(startSlider.value);
            const end = parseInt(endSlider.value);
            
            // Ensure bi-directional logic works
            const minH = Math.min(start, end);
            const maxH = Math.max(start, end);

            const filtered = masterData.filter(d => 
                d[2] >= minH && d[2] <= maxH && activeDays.includes(d[3])
            );

            // Hexlayer expects data in [lng, lat] format via the d3 data method
            hexLayer.data(filtered.map(d => [d[0], d[1]]));
            
            countLabel.innerText = filtered.length.toLocaleString();
            timeLabel.innerText = `${minH}:00 - ${maxH}:59`;
        }

        [startSlider, endSlider].forEach(s => s.addEventListener('input', applyFilters));

    </script>
</body>
</html>
