<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadium District Visitation Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-draw/1.0.4/leaflet.draw.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turf.js/6/turf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-draw/1.0.4/leaflet.draw.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Spline Sans', sans-serif;
            background: #0f1419;
            color: #e0e6ed;
            overflow: hidden;
        }

        .dashboard { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .header {
            background: linear-gradient(90deg, #1a1f2e 0%, #2d3748 100%);
            padding: 1.2rem 2rem;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; padding: 1rem; gap: 1rem; }
        .left-panel { width: 65%; display: flex; flex-direction: column; gap: 1rem; }
        .right-panel { width: 35%; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }

        .card {
            background: rgba(42, 50, 64, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(10px);
        }

        #map { flex: 1; border-radius: 12px; height: 100%; min-height: 400px; }
        
        .charts-container { display: flex; gap: 1rem; height: 30%; }
        .chart-card { flex: 1; display: flex; flex-direction: column; }
        canvas { flex: 1; min-height: 0; width: 100% !important; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .stat-box { background
